<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHOBBY'S Home | 3D Liquid Glass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <!-- Three.js for the insane 3D Hero -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --green: #2d4a3e;
      --green-deep: #1e3229;
      --cream: #eeeae0;
      --font-d: 'DM Serif Display', Georgia, serif;
      --font-b: 'Instrument Sans', sans-serif;
      --g-bg: rgba(255, 255, 255, 0.12);
      --g-blur: saturate(180%) blur(20px);
      /* Prism Effect */
      --rainbow: linear-gradient(135deg, #ff000022, #00ff0022, #0000ff22);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--cream);
      font-family: var(--font-b);
      color: #1a1a1a;
      overflow-x: hidden;
      cursor: none;
      /* Enabling 3D Perspective for the whole page */
      perspective: 1200px;
    }

    /* 3D CANVAS BACKGROUND */
    #hero-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* MOUSE LIGHTING EFFECT */
    .mouse-light {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      z-index: 10;
      transform: translate(-50%, -50%);
      mix-blend-mode: overlay;
    }

    /* ENHANCED GLASS */
    .glass-3d {
      background: var(--g-bg);
      backdrop-filter: var(--g-blur);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      transform-style: preserve-3d;
      transition: transform 0.2s ease-out;
    }

    /* CURSOR */
    .cur-ring {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 1.5px solid var(--green);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transition: width 0.3s, height 0.3s, background 0.3s;
      transform: translate(-50%, -50%);
    }

    /* HERO SECTION */
    .hero {
      position: relative;
      max-width: 1280px;
      margin: 0 auto;
      padding: 180px 5% 100px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: center;
      z-index: 2;
    }

    .hero-content {
      transform-style: preserve-3d;
    }

    h1 {
      font-family: var(--font-d);
      font-size: clamp(3rem, 6vw, 5.5rem);
      line-height: 0.95;
      margin-bottom: 24px;
      transform: translateZ(50px);
      /* 3D pop */
    }

    h1 em {
      color: var(--green);
      font-style: italic;
    }

    /* FLOATING 3D CARDS */
    .card-3d {
      width: 100%;
      height: 450px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .card-3d-inner {
      position: absolute;
      inset: 20px;
      background: url('https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=800') center/cover;
      border-radius: 25px;
      transform: translateZ(30px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .floating-badge {
      position: absolute;
      top: -20px;
      right: -20px;
      background: #fff;
      padding: 15px 25px;
      border-radius: 50px;
      font-weight: 800;
      transform: translateZ(80px);
      /* Deep 3D */
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    /* NAV */
    nav {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%) translateZ(100px);
      width: 90%;
      max-width: 1100px;
      padding: 15px 30px;
      border-radius: 100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--green);
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* SCENE BACKGROUND */
    .bg-blobs {
      position: fixed;
      inset: 0;
      z-index: -1;
      filter: blur(80px);
    }

    .blob {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: #cfe8d4;
      animation: move 20s infinite alternate;
    }

    @keyframes move {
      from {
        transform: translate(-10%, -10%) rotate(0deg);
      }

      to {
        transform: translate(20%, 20%) rotate(180deg);
      }
    }
  </style>
</head>

<body>
  <div class="mouse-light" id="mouseLight"></div>
  <div class="cur-ring" id="cRing"></div>

  <div class="bg-blobs">
    <div class="blob" style="top: -10%; left: -10%; background: #d0e1f9;"></div>
    <div class="blob" style="bottom: -10%; right: -10%; background: #f9d0d0; animation-delay: -5s;"></div>
  </div>

  <nav class="glass-3d">
    <div style="font-family: var(--font-d); font-size: 1.5rem;">KHOBBY'S.</div>
    <ul class="nav-links">
      <li><a href="#">Collections</a></li>
      <li><a href="#">Showroom</a></li>
      <li><a href="#">About</a></li>
    </ul>
    <button
      style="background: var(--green); color: white; border: none; padding: 10px 20px; border-radius: 50px; font-weight: bold;">Cart
      (0)</button>
  </nav>

  <section class="hero">
    <div class="hero-content" id="heroText">
      <div class="glass-3d"
        style="display: inline-block; padding: 8px 20px; border-radius: 50px; margin-bottom: 20px; font-size: 0.8rem; font-weight: bold; letter-spacing: 2px;">
        INTERACTIVE DESIGN
      </div>
      <h1>Live in a<br><em>3D Dreamscape</em></h1>
      <p
        style="font-size: 1.1rem; line-height: 1.6; color: #555; max-width: 500px; margin-bottom: 40px; transform: translateZ(30px);">
        Experience furniture like never before. Our liquid-glass interface reacts to your every move, creating a space
        that breathes with you.
      </p>
      <div style="display: flex; gap: 20px; transform: translateZ(40px);">
        <button
          style="background: #111; color: white; padding: 18px 40px; border-radius: 50px; border: none; font-weight: bold; cursor: none;">Explore
          3D</button>
        <button
          style="background: transparent; color: #111; padding: 18px 40px; border-radius: 50px; border: 1px solid #111; font-weight: bold; cursor: none;">Watch
          Film</button>
      </div>
    </div>

    <div class="card-3d" id="mainCard">
      <div class="card-3d-inner glass-3d"></div>
      <div class="floating-badge glass-3d">
        <span style="color: var(--green)">★ 4.9</span>
        <div style="font-size: 0.7rem; color: #888;">TOP RATED</div>
      </div>
    </div>
  </section>

  <script>
    const ring = document.getElementById('cRing');
    const light = document.getElementById('mouseLight');
    const heroText = document.getElementById('heroText');
    const mainCard = document.getElementById('mainCard');

    // SMOOTH MOUSE TRACKING
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX;
      const y = e.clientY;

      // Cursor Follow
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';

      // Light Follow
      light.style.left = x + 'px';
      light.style.top = y + 'px';

      // 3D PARALLAX EFFECT
      const moveX = (window.innerWidth / 2 - x) / 25;
      const moveY = (window.innerHeight / 2 - y) / 25;

      heroText.style.transform = `rotateY(${-moveX}deg) rotateX(${moveY}deg)`;
      mainCard.style.transform = `rotateY(${-moveX * 1.5}deg) rotateX(${moveY * 1.5}deg)`;
    });

    // HOVER EFFECTS
    document.querySelectorAll('button, a').forEach(el => {
      el.addEventListener('mouseenter', () => {
        ring.style.width = '80px';
        ring.style.height = '80px';
        ring.style.background = 'rgba(45, 74, 62, 0.1)';
      });
      el.addEventListener('mouseleave', () => {
        ring.style.width = '40px';
        ring.style.height = '40px';
        ring.style.background = 'transparent';
      });
    });

    // INITIALIZE THREE.JS FOR THE BACKGROUND (Optional insane feature)
    // This creates a subtle 3D mesh movement in the background
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    renderer.domElement.id = "hero-canvas";

    const geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
    const material = new THREE.MeshNormalMaterial({ wireframe: true, transparent: true, opacity: 0.05 });
    const knot = new THREE.Mesh(geometry, material);
    scene.add(knot);

    camera.position.z = 30;

    function animate() {
      requestAnimationFrame(animate);
      knot.rotation.x += 0.001;
      knot.rotation.y += 0.002;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
